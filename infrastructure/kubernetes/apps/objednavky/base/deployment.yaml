# Služba objednávky: základ, jak ho kolega nechal
apiVersion: apps/v1
kind: Deployment
metadata:
  name: objednavky
spec:
  replicas: 1
  selector:
    matchLabels:
      app: objednavky
  template:
    metadata:
      labels:
        app: objednavky
    spec:
      containers:
        - name: objednavky
          image: ghcr.io/stefanprodan/podinfo:6.15.0
          ports:
            - name: http
              containerPort: 9898
          envFrom:
            - configMapRef:
               name: objednavky-config
          resources:
            requests:
              cpu: 150m          
              memory: 128Mi
            limits:
              memory: 256Mi
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 10
            failureThreshold: 3
          env:
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: objednavky-db
                  key: DB_PASSWORD
      topologySpreadConstraints:
            - maxSkew: 1
              topologyKey: kubernetes.io/hostname
              whenUnsatisfiable: ScheduleAnyway
              labelSelector:
                matchLabels:
                   app: objednavky